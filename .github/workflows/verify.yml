name: Verify examples against released compiler

# The public stability signal: download a real Stenopos release binary and
# compile + run every verified example against it. This exercises the SHIPPED
# artifact, independent of the (private) compiler source and its CI — so even
# if the release pipeline hiccups, this still reports whether what users can
# download actually works.

on:
  # Run when a new compiler release is published (the stenopos repo sends a
  # repository_dispatch of type "release" via its release pipeline).
  repository_dispatch:
    types: [release]
  # Manual runs, optionally pinned to a specific version tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to verify (blank = latest)"
        required: false
        default: ""
  # A weekly canary so regressions in the latest release surface on their own.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and a C compiler
        run: |
          sudo apt-get update && sudo apt-get install -y llvm clang
          # Ensure `llc` is on PATH (Debian/Ubuntu may only ship llc-NN).
          command -v llc >/dev/null || \
            sudo ln -sf "$(ls /usr/bin/llc-* /usr/lib/llvm-*/bin/llc 2>/dev/null | head -1)" /usr/local/bin/llc

      - name: Download the Stenopos release binary
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          REPO="Stenopos/Syntagma"
          if [ -n "${REQUESTED:-}" ]; then
            TAG="$REQUESTED"
          else
            # All releases are pre-releases during alpha, so `gh release view`
            # (which resolves the "latest" NON-prerelease) would miss them or
            # pick a stale one. List releases newest-first and take the top.
            TAG="$(gh release list --repo "$REPO" --limit 1 --json tagName -q '.[0].tagName')"
          fi
          [ -n "$TAG" ] || { echo "no release found to verify"; exit 1; }
          echo "Verifying release: $TAG"
          # The shipped compiler is the self-hosted one, which links every
          # program against the native runtime (stenopos_runtime.c) at build time.
          # So download the runtime + installer too, not just the binary, and let
          # install.sh set them up (binary -> /usr/local/bin, runtime + prebuilt
          # object -> /usr/local/lib/stenopos) the same way a user would.
          gh release download "$TAG" --repo "$REPO" \
            -p 'stenopos-linux-x86_64' -p 'stenopos_runtime.c' -p 'install.sh' \
            -p 'SHA256SUMS' -D dl
          # Verify the checksums of what we downloaded.
          ( cd dl && grep -E 'stenopos-linux-x86_64|stenopos_runtime\.c|install\.sh' SHA256SUMS | sha256sum -c - )
          # gh release download does not preserve the executable bit; install.sh
          # detects a release layout by the binary being executable, so set it.
          chmod +x dl/stenopos-linux-x86_64
          sudo bash dl/install.sh /usr/local
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Run the verified example suite
        run: |
          chmod +x verified/verify.sh
          STENOPOS=stenopos ./verified/verify.sh

      - name: Summary
        if: always()
        run: echo "Verified examples against ${TAG:-latest}. See job log for per-example results." >> "$GITHUB_STEP_SUMMARY"
